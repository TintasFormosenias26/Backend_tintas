<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cargar Libro</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        padding: 30px;
      }

      .container {
        max-width: 900px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
      }

      .group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }

      input,
      textarea,
      select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
      }

      textarea {
        min-height: 100px;
        resize: vertical;
      }

      button {
        width: 100%;
        padding: 15px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
      }

      button:hover {
        background: #1d4ed8;
      }

      #result {
        margin-top: 20px;
        padding: 15px;
        border-radius: 6px;
        display: none;
      }

      .success {
        background: #dcfce7;
        color: #166534;
      }

      .error {
        background: #fee2e2;
        color: #991b1b;
      }

      .preview {
        margin-top: 10px;
        max-width: 200px;
      }

      .preview img {
        width: 100%;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Cargar Libro</h1>

      <form id="bookForm">
        <div class="group">
          <label>Título</label>
          <input type="text" name="title" required />
        </div>

        <div class="group">
          <label>Resumen</label>
          <textarea name="summary" required></textarea>
        </div>

        <div class="group">
          <label>Sinopsis</label>
          <textarea name="synopsis" required></textarea>
        </div>

        <div class="group">
          <label>Idioma</label>
          <input type="text" name="language" />
        </div>

        <div class="group">
          <label>Año</label>
          <input type="number" name="yearBook" />
        </div>

        <div class="group">
          <label>Género</label>
          <input type="text" name="genre" />
        </div>

        <div class="group">
          <label>Nivel</label>
          <select name="level">
            <option value="INICIAL">Inicial</option>
            <option value="SECUNDARIO">Secundario</option>
            <option value="JOVEN_ADULTO">Joven Adulto</option>
            <option value="ADULTO_MAYOR">Adulto Mayor</option>
          </select>
        </div>

        <div class="group">
          <label>Formato</label>
          <input type="text" name="format" placeholder="PDF, EPUB" />
        </div>

        <div class="group">
          <label>Extensión</label>
          <input type="text" name="fileExtension" placeholder=".pdf" />
        </div>

        <div class="group">
          <label>Temas (separados por coma)</label>
          <input type="text" name="theme" />
        </div>

        <div class="group">
          <label>Subgéneros (separados por coma)</label>
          <input type="text" name="subgenre" />
        </div>

        <div class="group">
          <label>Páginas</label>
          <input type="number" name="totalPages" />
        </div>

        <div class="group">
          <label>Duración (audiolibro)</label>
          <input type="number" name="duration" />
        </div>

        <div class="group">
          <label>
            <input type="checkbox" name="anthology" />
            Antología
          </label>
        </div>

        <div class="group">
          <label>Autores (IDs separados por coma)</label>
          <input type="text" name="authorIds" placeholder="id1,id2,id3" />
        </div>

        <div class="group">
          <label>Portada</label>
          <input type="file" id="img" accept="image/*" required />
        </div>

        <div class="preview">
          <img id="previewImage" style="display: none" />
        </div>

        <div class="group">
          <label>Archivo del Libro</label>
          <input type="file" id="file" accept=".pdf,.epub" required />
        </div>

        <button type="submit">Crear Libro</button>
      </form>

      <div id="result"></div>
    </div>

    <script>
      const API_URL = "http://localhost:3402/books";

      const form = document.getElementById("bookForm");
      const imgInput = document.getElementById("img");
      const fileInput = document.getElementById("file");
      const previewImage = document.getElementById("previewImage");
      const result = document.getElementById("result");

      console.log("Script cargado");

      imgInput.addEventListener("change", () => {
        const selectedFile = imgInput.files[0];

        if (!selectedFile) return;

        const reader = new FileReader();

        reader.onload = (e) => {
          previewImage.src = e.target.result;
          previewImage.style.display = "block";
        };

        reader.readAsDataURL(selectedFile);
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        console.log("Submit ejecutado");

        try {
          if (!imgInput.files.length) {
            throw new Error("Debe seleccionar una portada");
          }

          if (!fileInput.files.length) {
            throw new Error("Debe seleccionar un archivo");
          }

          const formData = new FormData(form);

          formData.set(
            "theme",
            JSON.stringify(
              (form.theme.value || "")
                .split(",")
                .map((x) => x.trim())
                .filter(Boolean),
            ),
          );

          formData.set(
            "subgenre",
            JSON.stringify(
              (form.subgenre.value || "")
                .split(",")
                .map((x) => x.trim())
                .filter(Boolean),
            ),
          );

          formData.set(
            "authorIds",
            JSON.stringify(
              (form.authorIds.value || "")
                .split(",")
                .map((x) => x.trim())
                .filter(Boolean),
            ),
          );

          formData.set("anthology", String(form.anthology.checked));

          formData.append("img", imgInput.files[0]);
          formData.append("file", fileInput.files[0]);

          console.log("Enviando petición a:", API_URL);

          const response = await fetch(API_URL, {
            method: "POST",
            body: formData,
          });

          console.log("Status:", response.status);

          const text = await response.text();

          console.log("Respuesta:", text);

          if (!response.ok) {
            throw new Error(text);
          }

          result.style.display = "block";
          result.className = "success";
          result.innerHTML = "Libro creado correctamente";

          alert("Libro creado correctamente");
        } catch (error) {
          console.error(error);

          result.style.display = "block";
          result.className = "error";
          result.innerHTML = error.message;

          alert(error.message);
        }
      });
    </script>
  </body>
</html>
