<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Autor</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 30px;
      }

      form {
        background: white;
        max-width: 500px;
        margin: auto;
        padding: 25px;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      input,
      textarea,
      select,
      button {
        padding: 10px;
        font-size: 15px;
      }

      button {
        cursor: pointer;
        background: #222;
        color: white;
        border: none;
        border-radius: 5px;
      }

      button:hover {
        opacity: 0.8;
      }

      #resultado {
        max-width: 500px;
        margin: 20px auto;
        background: white;
        padding: 15px;
      }
    </style>
  </head>

  <body>
    <form id="authorForm">
      <h2>Crear Autor</h2>

      <input
        type="text"
        name="fullName"
        placeholder="Nombre completo"
        required
      />

      <textarea name="biography" placeholder="Biografía" required></textarea>

      <input type="text" name="profession" placeholder="Profesión" required />

      <label> Fecha de nacimiento </label>

      <input type="date" name="birthdate" required />

      <input
        type="text"
        name="birthplace"
        placeholder="Lugar de nacimiento"
        required
      />

      <input
        type="text"
        name="nationality"
        placeholder="Nacionalidad"
        required
      />

      <select name="isActivo">
        <option value="true">Activo</option>

        <option value="false">Inactivo</option>
      </select>

      <label> Imagen del autor </label>

      <input type="file" name="avatar" accept="image/*" required />

      <button type="submit">Crear Autor</button>
    </form>

    <div id="resultado"></div>

    <script>
      const form = document.getElementById("authorForm");
      const resultado = document.getElementById("resultado");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const formData = new FormData(form);

        try {
          const response = await fetch(
            "http://localhost:3000/api/authors/authors/create",
            {
              method: "POST",
              body: formData,
              credentials: "include",
            },
          );

          const data = await response.json();

          resultado.innerHTML = `
            <pre>
${JSON.stringify(data, null, 2)}
            </pre>
        `;

          if (response.ok) {
            form.reset();
          }
        } catch (error) {
          resultado.innerHTML = `
            Error de conexión:
            ${error.message}
        `;
        }
      });
    </script>
  </body>
</html>
