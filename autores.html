<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Autor</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f9;
        padding: 30px;
      }

      .container {
        max-width: 800px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #444;
      }

      input[type="text"],
      input[type="date"],
      textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
      }

      textarea {
        resize: vertical;
        min-height: 120px;
      }

      input[type="file"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: white;
      }

      .checkbox-container {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .checkbox-container label {
        margin: 0;
      }

      button {
        width: 100%;
        border: none;
        background: #2563eb;
        color: white;
        padding: 14px;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      .preview {
        margin-top: 10px;
        display: none;
        max-width: 200px;
        border-radius: 8px;
        border: 1px solid #ddd;
      }

      .response {
        margin-top: 20px;
        padding: 15px;
        border-radius: 6px;
        display: none;
      }

      .success {
        background: #dcfce7;
        color: #166534;
      }

      .error {
        background: #fee2e2;
        color: #991b1b;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Registro de Autor</h1>

      <form id="authorForm">
        <div class="form-group">
          <label>Nombre Completo</label>
          <input type="text" id="fullName" required />
        </div>

        <div class="form-group">
          <label>Biografía</label>
          <textarea id="biography" required></textarea>
        </div>

        <div class="form-group">
          <label>Profesión</label>
          <input type="text" id="profession" required />
        </div>

        <div class="form-group">
          <label>Fecha de Nacimiento</label>
          <input type="date" id="birthdate" required />
        </div>

        <div class="form-group">
          <label>Lugar de Nacimiento</label>
          <input type="text" id="birthplace" required />
        </div>

        <div class="form-group">
          <label>Nacionalidad</label>
          <input type="text" id="nationality" required />
        </div>

        <div class="form-group">
          <label>Fotografía</label>
          <input type="file" id="photoIdImage" accept="image/*" required />

          <img id="preview" class="preview" />
        </div>

        <div class="form-group checkbox-container">
          <input type="checkbox" id="itActivo" checked />

          <label for="itActivo"> Autor Activo </label>
        </div>

        <button type="submit">Guardar Autor</button>
      </form>

      <div id="response" class="response"></div>
    </div>

    <script>
      const API_URL = "http://localhost:3402/author/create";
      // Cambia la URL según tu backend

      const form = document.getElementById("authorForm");

      const preview = document.getElementById("preview");

      const photoInput = document.getElementById("photoIdImage");

      const responseBox = document.getElementById("response");

      photoInput.addEventListener("change", () => {
        const file = photoInput.files[0];

        if (!file) {
          preview.style.display = "none";
          return;
        }

        preview.src = URL.createObjectURL(file);

        preview.style.display = "block";
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        try {
          const formData = new FormData();

          formData.append(
            "fullName",
            document.getElementById("fullName").value,
          );

          formData.append(
            "biography",
            document.getElementById("biography").value,
          );

          formData.append(
            "profession",
            document.getElementById("profession").value,
          );

          formData.append(
            "birthdate",
            document.getElementById("birthdate").value,
          );

          formData.append(
            "birthplace",
            document.getElementById("birthplace").value,
          );

          formData.append(
            "nationality",
            document.getElementById("nationality").value,
          );

          formData.append(
            "itActivo",
            document.getElementById("itActivo").checked,
          );

          const file = photoInput.files[0];

          if (file) {
            formData.append("avatar", file);
          }

          const response = await fetch(API_URL, {
            method: "POST",
            body: formData,
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || "Error al registrar autor");
          }

          responseBox.className = "response success";

          responseBox.style.display = "block";

          responseBox.innerHTML = `
            <strong>Autor registrado correctamente</strong>
            <br><br>
            ID: ${data.id || "Generado"}
        `;

          form.reset();

          preview.style.display = "none";
        } catch (error) {
          responseBox.className = "response error";

          responseBox.style.display = "block";

          responseBox.innerHTML = error.message;

          console.error(error);
        }
      });
    </script>
  </body>
</html>
