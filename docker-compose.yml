name: tintas-backend-development

services:
  api:
    image: tintas-backend-dev:${BACKEND_IMAGE_TAG:-latest}
    container_name: tintas-backend-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    environment:
      NODE_ENV: development
      PORT: "3400"
      DATABASE_URL: ${DATABASE_URL:?Definir DATABASE_URL en .env}
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CLOUD_NAME: ${CLOUD_NAME:?Definir CLOUD_NAME en .env}
      API_KEY: ${API_KEY:?Definir API_KEY en .env}
      API_SECRET: ${API_SECRET:?Definir API_SECRET en .env}
      API_RENDER: ${API_RENDER:?Definir API_RENDER en .env}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3400}:3400"
    volumes:
      - .:/app
      - backend-node-modules:/app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3400/health/live',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    profiles: ["tools"]
    image: tintas-backend-dev:${BACKEND_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    environment:
      DATABASE_URL: ${DATABASE_URL:?Definir DATABASE_URL en .env}
    volumes:
      - .:/app
      - backend-node-modules:/app/node_modules
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]

volumes:
  backend-node-modules:
