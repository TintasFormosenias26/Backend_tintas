services:
  api:
    image: tintas-backend:${IMAGE_TAG:-test-local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3400
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CLOUD_NAME: ${CLOUD_NAME:?CLOUD_NAME is required}
      API_KEY: ${API_KEY:?API_KEY is required}
      API_SECRET: ${API_SECRET:?API_SECRET is required}
      API_RENDER: ${API_RENDER:?API_RENDER is required}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3400}:3400"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /app/uploads:size=128m,mode=0700,uid=1001,gid=1001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3400/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
